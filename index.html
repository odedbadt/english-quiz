<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אנגלית — מילים ואיות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מילים ואיות">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="brand">אנגלית: אוצר מילים <span>&amp;</span> איות</h1>
      <dl class="stats">
        <div><dt>שאלות</dt><dd id="stat-asked">0</dd></div>
        <div><dt>אחוז הצלחה</dt><dd id="stat-rate">—</dd></div>
        <div><dt>פריטים שנשלטו</dt><dd id="stat-mastered">0</dd></div>
      </dl>
      <div class="mastery-bar"><span id="mastery-fill"></span></div>
      <div class="tracks" id="tracks"></div>
    </header>

    <main class="card" id="card" aria-live="polite">
      <p class="kicker"><span id="kicker-type"></span><span class="kicker-section" id="kicker-section"></span><span class="pips" id="pips" title="דרגת שליטה בשאלה הזאת"></span></p>
      <h2 class="prompt" id="prompt">טוען…</h2>
      <p class="gloss" id="gloss" hidden></p>
      <p class="say" id="say" hidden></p>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" hidden></p>
      <p class="pattern" id="pattern" dir="ltr" lang="en" hidden></p>
      <p class="note" id="note" hidden></p>
      <p class="unlocked" id="unlocked" hidden></p>
      <button class="next" id="next" hidden>לשאלה הבאה <span aria-hidden="true">←</span></button>
    </main>

    <footer class="controls">
      <fieldset class="modes">
        <legend>סוגי שאלות</legend>
        <label><input type="checkbox" id="mode-he-en" checked> עברית ← אנגלית</label>
        <label><input type="checkbox" id="mode-en-he" checked> אנגלית ← עברית</label>
        <label><input type="checkbox" id="mode-spelling" checked> איות באנגלית</label>
      </fieldset>
      <div class="actions">
        <button class="reset" id="reset" type="button">איפוס התקדמות</button>
        <button class="refresh" id="refresh" type="button">בדיקת עדכון</button>
      </div>
      <p class="appver" id="appver" hidden></p>
      <p class="tip">אפשר לענות גם במקשים <kbd>1</kbd>–<kbd>4</kbd>, ולהמשיך ב־<kbd>Enter</kbd>.</p>
    </footer>
  </div>

  <script src="js/data-vocab.js"></script>
  <script src="js/data-spelling.js"></script>
  <script src="js/sections.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* עבודה אופליין. דורש HTTPS (או localhost). */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* לא קריטי */ });
      });
    }
  </script>
</body>
</html>
